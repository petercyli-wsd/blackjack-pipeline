services:
  - type: web
    name: dealer-transition-studio-team
    runtime: docker
    # Hosting must remain free. Do not upgrade without explicit user authorization.
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: STUDIO_HOSTED
        value: "true"
      - key: TEAM_PASSWORD
        generateValue: true
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_SESSIONS
        value: "10"
